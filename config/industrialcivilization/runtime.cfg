# Configuration file

ecology {
    # Maximum naturally converted militia patrols within the configured outpost patrol radius.
    I:militiaPatrolLocalCap=6

    # Maximum distance from a registered militia outpost where patrols may naturally appear.
    I:militiaPatrolRadius=128

    # Maximum naturally converted Robbers within 64 blocks before new attempts are rejected.
    I:robberLocalCap=4

    # Percent of ordinary Earth zombie spawn attempts converted into Robbers.
    I:robberSpawnPercent=25
}

progression {
    # Return unauthorized players to Earth when entering the Moon or Mars.
    # Set false only for deliberate creative testing.
    B:enforceSpaceResearchGates=true
}

testing {
    # Automatically run this scenario in a disposable client world. Leave blank during normal play.
    S:autoScenario=

    # Enables /ic_test snapshots and destructive disposable-world scenarios.
    # Keep false in distribution builds; this private Technic instance is a development target.
    B:enableTestBridge=true
}
