# Configuration file

general {
    # The color of the ping display text, written in hex format. Default: #A0A0A0
    S:textColor=A0A0A0

    # Upstream 1.0 has its validation branch inverted: a valid %d format logs an
    # error, while any non-matching sentinel silently selects the valid %dms
    # built-in default. Keep this sentinel until that upstream bytecode is fixed.
    S:textFormatString=use_builtin_default
}
