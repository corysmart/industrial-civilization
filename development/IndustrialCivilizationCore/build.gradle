buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:3.+' }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'java'

version = '0.9.0'
group = 'com.industrialcivilization'
archivesBaseName = 'IndustrialCivilizationCore'
sourceCompatibility = targetCompatibility = '1.8'

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'
    compileOnly files('../../mods/cc-tweaked-1.12.2-1.89.2.jar')
    compileOnly files('../../mods/BetterQuesting-3.5.329.jar')
    compileOnly files('../../mods/IC2Classic-1.12.2-1.5.11.jar')
    compileOnly files('../../mods/vehicle-mod-1.4.0-1.12.2.jar')
    compileOnly files('../../mods/ICBM-classic-1.12.2-6.5.5.jar')
    compileOnly files('../../mods/industrialforegoing-1.12.2-1.12.13-237.jar')
    compileOnly files('../../mods/tesla-core-lib-1.12.2-1.0.18.jar')
    compileOnly files('../../mods/Galacticraft-1.12.2-4.0.7-technic-ic2c.jar')
    compileOnly files('../../mods/buildcraft-all-7.99.24.8.jar')
    compileOnly files('../../mods/ProjectRed-1.12.2-4.9.4.120-Base.jar')
    compileOnly files('../../mods/ProjectRed-1.12.2-4.9.4.120-mechanical.jar')
    compileOnly files('../../mods/ProjectRed-1.12.2-4.9.4.120-integration.jar')
    compileOnly files('../../mods/MrTJPCore-2.1.5.1-universal.jar')
    compileOnly files('../../mods/CodeChickenLib-1.12.2-3.2.3.358-universal.jar')
    compileOnly files('../../mods/ForgeMultipart-1.12.2-2.6.3.1-universal.jar')
    testImplementation 'junit:junit:4.13.2'
    testImplementation files('../../mods/cc-tweaked-1.12.2-1.89.2.jar')
    testImplementation files('../../mods/IC2Classic-1.12.2-1.5.11.jar')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('mcmod.info') { expand 'version': project.version }
}

jar {
    manifest {
        attributes(
            'FMLCorePlugin': 'com.industrialcivilization.core.bootstrap.IngredientRegistryCorePlugin',
            'FMLCorePluginContainsFMLMod': 'true',
            'Specification-Title': 'Industrial Civilization Core',
            'Specification-Vendor': 'Industrial Civilization',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'Industrial Civilization'
        )
    }
}

jar.finalizedBy('reobfJar')
